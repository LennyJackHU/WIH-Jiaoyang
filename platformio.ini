[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    zinggjm/GxEPD2@^1.6.3
    madhephaestus/ESP32Encoder@^0.11.5
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<wlp2_json.cpp>
    +<wlp2_protocol.cpp>
    +<picker.cpp>
    +<words.cpp>
    +<word_game.cpp>
build_flags =
    -std=c++11
    -Wall
    -Wextra
    -Werror
